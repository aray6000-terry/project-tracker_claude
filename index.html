<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://accounts.google.com/gsi/; img-src 'self' data: blob: https://*.googleusercontent.com; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>弱電專案進度追蹤</title>
<meta name="description" content="依施工 8 個時間結點追蹤弱電監控專案進度、查驗關卡與表單（需登入）">
<style>
:root{
  --bg:#f5f4ef;--surface:#ffffff;--surface-2:#efede6;--ink:#1d2433;--ink-2:#5a6474;--line:#dedad0;
  --accent:#1f5fa8;--accent-soft:#e3edf8;--ok:#2e7d4f;--ok-soft:#e3f2e8;--warn:#b5651d;--warn-soft:#fbeedd;
  --bad:#b3261e;--bad-soft:#fbe4e2;--idle:#8a93a2;--on-accent:#ffffff;--shadow:0 1px 2px rgba(20,30,50,.06),0 4px 16px rgba(20,30,50,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14181f;--surface:#1c222c;--surface-2:#242b37;--ink:#e8ebf0;--ink-2:#a3adbd;--line:#323b49;
    --accent:#6fa8ef;--accent-soft:#1f3150;--ok:#5fc48a;--ok-soft:#1d3528;--warn:#e8a25c;--warn-soft:#3a2c1b;
    --bad:#f08a80;--bad-soft:#3d2321;--idle:#7b8596;--on-accent:#0f1622;--shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14181f;--surface:#1c222c;--surface-2:#242b37;--ink:#e8ebf0;--ink-2:#a3adbd;--line:#323b49;
  --accent:#6fa8ef;--accent-soft:#1f3150;--ok:#5fc48a;--ok-soft:#1d3528;--warn:#e8a25c;--warn-soft:#3a2c1b;
  --bad:#f08a80;--bad-soft:#3d2321;--idle:#7b8596;--on-accent:#0f1622;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 64px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0 12px;flex-wrap:wrap}
.brand h1{font-size:22px;margin:0;letter-spacing:.5px}
.brand p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad)}
.btn.small{padding:4px 10px;font-size:13px}
.userchip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 4px 3px 12px;max-width:100%}
.userchip b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0 20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .n{font-size:28px;font-weight:700;line-height:1.1}
.stat .l{color:var(--ink-2);font-size:13px}
.stat.bad .n{color:var(--bad)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.search{flex:1;min-width:160px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:10px}
.card:hover{border-color:var(--accent)}
.card h3{margin:0;font-size:17px;overflow-wrap:anywhere}
.meta{color:var(--ink-2);font-size:13px;overflow-wrap:anywhere}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.ok>i{background:var(--ok)}
.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;font-weight:600;white-space:nowrap}
.b-idle{background:var(--surface-2);color:var(--ink-2)}
.b-run{background:var(--accent-soft);color:var(--accent)}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.dots{display:flex;gap:4px}
.dots span{flex:1;height:6px;border-radius:3px;background:var(--surface-2)}
.dots .s-run{background:var(--accent)}.dots .s-ok{background:var(--ok)}.dots .s-bad{background:var(--bad)}
.empty{text-align:center;color:var(--ink-2);padding:48px 16px;border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:14px}
/* login */
.login{min-height:70vh;display:grid;place-items:center}
.login-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 28px;box-shadow:var(--shadow);width:min(440px,100%);text-align:center}
.login-box h2{margin:0 0 6px;font-size:22px}
.login-box p{color:var(--ink-2);margin:0 0 18px;font-size:14px}
#gsiBtn{display:flex;justify-content:center;min-height:44px}
.login-box .sec{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2);text-align:left}
.login-box .sec li{margin:2px 0}
/* detail */
.back{margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.savestate{font-size:13px;color:var(--ink-2)}
.savestate.bad{color:var(--bad);font-weight:600}
.detail-head{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.detail-head h2{margin:0 0 6px;font-size:21px;overflow-wrap:anywhere}
.info{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.info div{background:var(--surface-2);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
.info b{display:block;font-size:12px;color:var(--ink-2);font-weight:500}
.steps{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;margin:6px 0 2px}
.step{flex:1 0 108px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);cursor:pointer;text-align:left}
.step .k{font-size:12px;color:var(--ink-2)}
.step .t{font-size:13px;font-weight:600;line-height:1.3;margin:2px 0 4px}
.step.s-ok{border-color:var(--ok);background:var(--ok-soft)}
.step.s-run{border-color:var(--accent);background:var(--accent-soft)}
.step.s-bad{border-color:var(--bad);background:var(--bad-soft)}
.node{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.node>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.node>summary::-webkit-details-marker{display:none}
.node .num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--surface-2);color:var(--ink-2);flex:none}
.node.s-ok .num{background:var(--ok);color:var(--on-accent)}.node.s-run .num{background:var(--accent);color:var(--on-accent)}.node.s-bad .num{background:var(--bad);color:var(--on-accent)}
.node .title{font-weight:700;flex:1;min-width:140px}
.node .pct{font-size:13px;color:var(--ink-2);min-width:64px;text-align:right}
.node-body{padding:0 16px 16px;border-top:1px solid var(--line)}
.dates{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0 8px}
.dates label{font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.dates input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 8px}
.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px}
.group h4{margin:8px 0 6px;font-size:13px;color:var(--ink-2);font-weight:600;letter-spacing:.5px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer}
.chk:hover{background:var(--surface-2)}
.chk input{margin-top:4px;width:16px;height:16px;flex:none;accent-color:var(--accent)}
.chk.done span{color:var(--ink-2);text-decoration:line-through}
.ro .chk{cursor:default}
textarea.note{width:100%;min-height:64px;margin-top:10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;resize:vertical}
/* tables */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.panel h3{margin:0 0 4px;font-size:17px}
.tblwrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--ink-2);font-weight:600;white-space:nowrap}
td input[type=text],td input[type=email],td select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 8px;width:100%;min-width:90px}
td.c{text-align:center}
#newUserRow td.newhead{display:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
/* modal */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,15,25,.45)}
dialog form,dialog .dbody{padding:20px}
dialog h3{margin:0 0 14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.fgrid .full{grid-column:1/-1}
.fgrid input,.fgrid textarea,.fgrid select,.addrow select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;color:var(--ink)}
dialog{max-height:calc(100vh - 32px);overflow:auto}
.syspick{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0}
.syspick legend{font-size:13px;color:var(--ink-2);padding:0 4px}
#sysPick{display:flex;flex-wrap:wrap;gap:6px 14px}
.pick{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);padding:4px 0;cursor:pointer}
.fgrid .pick{flex-direction:row;color:var(--ink);font-size:14px}
.pick input,.fgrid .pick input{width:18px;height:18px;padding:0;border:0;accent-color:var(--accent);flex:none}
.sysgrp{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding-top:6px;border-top:1px dashed var(--line)}
.sysgrp b{font-size:13px;color:var(--ink-2);font-weight:600;min-width:84px}
.sysgrp input[name=otherName]{flex:1;min-width:160px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;color:var(--ink)}
.brandhead{margin:10px 0 6px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2);font-weight:600}
#brandRows{display:grid;grid-template-columns:1fr;gap:6px}
.fgrid .brandrow,.brandrow{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.brandrow input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;color:var(--ink);min-width:0}
.sysbox{margin:6px 0 4px;padding:10px 12px;background:var(--surface-2);border-radius:10px}
.sysbox h4{margin:0 0 8px;font-size:13px;color:var(--ink-2);font-weight:600}
.sysrow{display:grid;grid-template-columns:150px 110px 1fr;gap:8px;align-items:center;padding:4px 0}
.sysrow .sn{font-weight:600;font-size:14px}
.sysrow select,.sysrow input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
.sysrow.need input{border-color:var(--warn);background:var(--warn-soft)}
.sysrow.ok .sn{color:var(--ok)}
.mxwrap{margin:0 0 12px}
.mxwrap>summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--accent);padding:4px 0}
table.mx{font-size:13px;min-width:520px}
table.mx th,table.mx td{padding:6px 4px;white-space:nowrap}
table.mx td.ok{color:var(--ok);font-weight:600}
table.mx td.run{color:var(--accent)}
table.mx sup{color:var(--warn);font-weight:700}
.mainnav{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 14px;border-bottom:1px solid var(--line)}
.mainnav a{padding:8px 14px;text-decoration:none;color:var(--ink-2);border-bottom:3px solid transparent;font-weight:600}
.mainnav a.on{color:var(--accent);border-bottom-color:var(--accent)}
.ptabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding-bottom:2px}
.ptabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;cursor:pointer;font-size:14px}
.ptabs button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.tipbox{margin:4px 0 8px;padding:8px 12px;border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:6px;font-size:14px}
.tipbox b{margin-right:8px;color:var(--warn)}
table.perm th,table.perm td{font-size:13px;white-space:nowrap}
table.perm td.yes{color:var(--ok);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:0 0 16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .n{font-size:24px;font-weight:700}.kpi .l{font-size:13px;color:var(--ink-2)}.kpi.bad .n{color:var(--bad)}.kpi.warn .n{color:var(--warn)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list li .main{flex:1;min-width:200px}
.list li .main b{display:block}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.thumbs figure{margin:0;background:var(--surface-2);border-radius:8px;overflow:hidden;cursor:pointer}
.thumbs img{width:100%;height:110px;object-fit:cover;display:block}
.thumbs figcaption{font-size:12px;padding:4px 6px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uprow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.uprow select,.uprow input[type=text],.fld{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;color:var(--ink)}
.items td input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 8px;width:100%;min-width:60px}
.status{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;font-weight:600}
.st-submitted,.st-billed,.st-open{background:var(--accent-soft);color:var(--accent)}
.st-confirmed,.st-invoiced,.st-doing,.st-done{background:var(--warn-soft);color:var(--warn)}
.st-shipped,.st-paid,.st-closed{background:var(--ok-soft);color:var(--ok)}
.st-rejected,.st-cancelled,.st-overdue{background:var(--bad-soft);color:var(--bad)}
.st-pending{background:var(--surface-2);color:var(--ink-2)}
.pipeline{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.pipeline span.on{color:var(--accent);font-weight:700}
.panel .status{white-space:nowrap}table.qty td,table.qty th{text-align:right;white-space:nowrap}table.qty td:nth-child(-n+2),table.qty th:nth-child(-n+2){text-align:left}table.iot td:nth-child(3),table.iot td:nth-child(4),table.iot th:nth-child(3),table.iot th:nth-child(4){text-align:left}table.qty tr.grp td{border-top:2px solid var(--line)}
.netwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.netsvg{display:block;min-width:900px;width:100%;height:auto;font-family:inherit}
.netsvg .t-h{font-size:15px;font-weight:700;fill:var(--ink)}.netsvg .t-s{font-size:11px;fill:var(--ink-2)}.netsvg .t-f{font-size:13px;font-weight:700;fill:var(--ink)}.netsvg .t-b{font-size:12px;fill:var(--ink)}
.netsvg .band{fill:var(--accent-soft);opacity:.35}
.netsvg .bx-acc{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}.netsvg .bx-cam{fill:var(--surface);stroke:var(--warn);stroke-width:1.5}
.netsvg .bx-dist{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}.netsvg .bx-core{fill:var(--accent);stroke:var(--accent)}
.netsvg .bx-core+text,.netsvg .bx-core+text+text{fill:#fff}
.netsvg .ln-f{fill:none;stroke:var(--ink-2);stroke-width:1;opacity:.6}.netsvg .ln-c{fill:none;stroke:var(--accent);stroke-width:2}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-2);margin:8px 0}.legend .lg{display:inline-block;width:14px;height:10px;border-radius:3px;border:1.5px solid var(--accent);margin-right:-8px}
.legend .lg.cam{border-color:var(--warn)}.legend .lg.dist{background:var(--accent-soft)}.legend .lg.core{background:var(--accent)}
tr.muted td{color:var(--ink-2);opacity:.7}
.plansvg{min-width:700px;max-height:75vh;background:var(--surface)}
.plansvg .pl-wall{fill:none;stroke:var(--ink-2);opacity:.45}
.plansvg .pl-run{fill:none;opacity:.85}.plansvg .pl-dev{stroke:none}.plansvg .pl-panel{fill:var(--accent);stroke:#fff}
.w-ip{stroke:#1f6fd1;fill:#1f6fd1;background:#1f6fd1}.w-cam{stroke:#d9822b;fill:#d9822b;background:#d9822b}.w-di{stroke:#2e9d5b;fill:#2e9d5b;background:#2e9d5b}
.w-do{stroke:#8a4fd1;fill:#8a4fd1;background:#8a4fd1}.w-unit{stroke:#8d96a3;fill:#8d96a3;background:#8d96a3}.w-door{stroke:#d0436b;fill:#d0436b;background:#d0436b}
.w-lane{stroke:#b8860b;fill:#b8860b;background:#b8860b}.w-audio{stroke:#16a3a3;fill:#16a3a3;background:#16a3a3}.w-bus{stroke:#6b7a2e;fill:#6b7a2e;background:#6b7a2e}.w-other{stroke:#555;fill:#555;background:#555}
.lgw{display:inline-block;width:14px;height:4px;border-radius:2px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:20;padding:16px}
.lightbox img{max-width:100%;max-height:85vh;border-radius:8px}
.lightbox p{color:#fff;text-align:center;margin:8px 0 0}
.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}
.sign div{border-top:1px solid var(--ink);padding-top:6px;text-align:center;font-size:14px}
.factions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--ink-2);margin-top:6px}
.mlist{list-style:none;margin:8px 0 0;padding:0}
.mlist li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mlist li .who{flex:1;min-width:160px;overflow-wrap:anywhere}
.mlist select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.addrow select{flex:1;min-width:160px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1}
.loading{color:var(--ink-2);text-align:center;padding:48px 0}
footer{margin-top:32px;color:var(--ink-2);font-size:12px;text-align:center}
@media (max-width:760px){
  /* 手機：輸入框 16px 避免 iPhone 點擊時自動放大；按鈕與勾選加大方便手指點選 */
  input,select,textarea{font-size:16px!important}
  .btn{min-height:40px}
  .btn.small{min-height:36px;padding:6px 12px}
  .chk{padding:10px 8px}
  .chk input{width:20px;height:20px;margin-top:2px}
  td input[type=checkbox]{width:22px;height:22px}
  header.top{padding:14px 0 8px}
  .brand p{display:none}
  .back{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:0 0 8px}
  .login{min-height:auto;padding-top:8px}
  .login-box{padding:24px 16px}
  .node>summary{gap:8px 10px;padding:12px 14px}
  .node .title{min-width:0}
  .node>summary .meta{flex-basis:100%;order:5;padding-left:38px}
  .node .pct{order:4;min-width:0}
  .info{gap:8px}
  .dates{gap:10px}
  .dates label{flex:1;min-width:130px}
  .dates input{width:100%}
  /* 管理表格改成卡片式，不必左右滑 */
  .sysrow{grid-template-columns:1fr 120px}
  #brandRows{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .sign{grid-template-columns:1fr}
  .mainnav a{padding:8px 10px}
  .sysrow input{grid-column:1/-1}
  table.cards thead{display:none}
  table.cards,table.cards tbody{display:block}
  table.cards tr{display:block;border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin-bottom:10px;background:var(--surface)}
  table.cards td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:6px 0;text-align:right;overflow-wrap:anywhere}
  table.cards td::before{content:attr(data-label);color:var(--ink-2);font-size:13px;flex:none;text-align:left}
  table.cards td input[type=text],table.cards td input[type=email],table.cards td select{flex:1;max-width:220px}
  table.cards td.act{justify-content:flex-end}
  table.cards td.act::before,table.cards td.newhead::before{content:none}
  #newUserRow td.newhead{display:block;font-weight:700;text-align:left}
  table.log td{font-size:13px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .info{grid-template-columns:repeat(2,1fr)}
  .groups{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .brand h1{font-size:19px}
  .userchip b{max-width:120px}
}
@media print{
  .tools,.filters,.back,.btn,footer,.userchip{display:none!important}
  body{background:#fff}
  .node{break-inside:avoid}
  details.node:not([open])>.node-body{display:block}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>弱電專案進度追蹤</h1>
      <p>依 8 個施工時間結點追蹤完成事項、查驗關卡與產出表單</p>
    </div>
    <div class="tools" id="tools" hidden>
      <button class="btn primary" id="btnNew" type="button" hidden>＋ 新增專案</button>
      <button class="btn" id="btnImport" type="button" hidden>匯入舊資料</button>
      <button class="btn" id="btnAdmin" type="button" hidden>權限管理</button>
      <button class="btn" id="btnTheme" type="button">深淺色</button>
      <span class="userchip"><span id="roleTag"></span><b id="userName"></b><button class="btn small" id="btnLogout" type="button">登出</button></span>
      <input type="file" id="fileImport" accept="application/json,.json" hidden>
    </div>
    <div class="tools" id="toolsGuest"><button class="btn" id="btnTheme2" type="button">深淺色</button></div>
  </header>
  <nav id="nav" class="mainnav" hidden></nav>
  <main id="app"><div class="loading">載入中…</div></main>
  <footer>資料存放於公司 Google Drive，需以已開通的 Google 帳號登入。依《專案工程師養成計畫》施工時間結點（補齊版）建立。</footer>
</div>

<dialog id="dlg">
  <form id="frm" method="dialog">
    <h3 id="dlgTitle">新增專案</h3>
    <div class="fgrid">
      <label class="full">專案名稱 *<input name="name" required maxlength="80" placeholder="例：○○建設 ○○案 弱電工程"></label>
      <label>業主／營造<input name="client" maxlength="60"></label>
      <label>案場地點<input name="site" maxlength="60"></label>
      <label>負責工程師<input name="engineer" maxlength="30"></label>
      <label>帶案師父<input name="mentor" maxlength="30"></label>
      <label>合約金額（選填）<input name="amount" maxlength="30" placeholder="例：NT$ 3,200,000"></label>
      <label>預計驗屋交屋日<input name="handover" type="date"></label>
      <label>業務負責人<select name="salesRep" id="salesRepSel"></select></label>
      <label>合約編號<input name="contractNo" maxlength="40"></label>
      <label>合約總價（未稅，元）<input name="contractAmount" inputmode="numeric" maxlength="15" placeholder="例：3200000"></label>
      <label class="full">合約付款條件<textarea name="payCondition" rows="2" maxlength="500" placeholder="例：訂金 30%、完工 60%、保固 10%（各期請款在「請款」頁設定）"></textarea></label>
      <fieldset class="full syspick"><legend>本案建置系統（可複選；勾選的系統在每個結點都要填目前進度與缺的項目）</legend><div id="sysPick"></div><div class="brandhead">各系統廠牌（可從清單選擇，或直接輸入）</div><div id="brandRows"></div></fieldset>
      <label class="full" id="ownerWrap" hidden>負責帳號（登入後可看到此專案）<select name="owner" id="ownerSel"></select></label>
      <label class="full">備註<textarea name="note" rows="2" maxlength="500"></textarea></label>
    </div>
    <p class="hint">填入交屋日時，系統會依常見工序自動帶入今天以後各結點的建議日期（已過去的結點請自行填寫），可再修改。</p>
    <div class="factions">
      <button class="btn" value="cancel" type="submit" formnovalidate>取消</button>
      <button class="btn primary" value="ok" type="submit">儲存</button>
    </div>
  </form>
</dialog>

<dialog id="dlgShare">
  <div class="dbody">
    <h3>分享專案</h3>
    <p class="meta" id="shareOwner"></p>
    <div id="ownerAdmin" hidden class="addrow"><select id="newOwner" aria-label="變更負責人"></select><button class="btn small" id="btnSetOwner" type="button">變更負責人</button></div>
    <ul class="mlist" id="memberList"></ul>
    <div class="addrow">
      <select id="shareUser" aria-label="選擇同事"></select>
      <select id="sharePerm" aria-label="權限"><option value="editor">可編輯</option><option value="viewer">僅檢視</option></select>
      <button class="btn primary small" id="btnShareAdd" type="button">加入</button>
    </div>
    <p class="hint">只能分享給管理員已開通的帳號。「可編輯」可勾選與修改內容；「僅檢視」只能看。只有負責人與管理員可以調整分享。</p>
    <div class="factions"><button class="btn" id="btnShareClose" type="button">關閉</button></div>
  </div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="app.js"></script>
<script src="ops.js"></script>
<script src="xlsx-lite.js"></script>
<script src="quote-core.js"></script>
<script src="analysis.js"></script>
<script src="io-core.js"></script>
<script src="design-core.js"></script>
<script src="design.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
